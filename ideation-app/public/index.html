<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💡</text></svg>" />
  <title>Idea Ranker</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- Home: session list + creation -->
  <section id="view-home" class="view">
    <header class="home-header">
      <h1>Idea Ranker</h1>
      <p class="sub">Generate ideas, rank them Tinder-style, capture the why.</p>
    </header>

    <div class="card panel">
      <h2>New session</h2>
      <label>Client name
        <input id="client-name" type="text" placeholder="e.g. Acme Fitness" />
      </label>
      <label>Client slug <span class="hint">(optional, used to attribute exports later)</span>
        <input id="client-slug" type="text" placeholder="e.g. faiez-rana" />
      </label>
      <label>Client brief <span class="hint">(niche, audience, goals, voice: the more the better)</span>
        <textarea id="client-brief" rows="5" placeholder="Who is this client, who is their audience, what do they sell, what do they want to be known for..."></textarea>
      </label>
      <label>Ideas to generate
        <input id="idea-count" type="number" value="100" min="1" max="300" />
      </label>
      <button id="btn-create" class="primary">Create &amp; generate ideas</button>
    </div>

    <div id="session-list" class="panel"></div>
  </section>

  <!-- Ranking -->
  <section id="view-rank" class="view hidden">
    <header class="rank-header">
      <button id="btn-back" class="ghost">←</button>
      <div class="progress-wrap">
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <span id="progress-label">0 / 0</span>
      </div>
      <span id="gen-status" class="gen-status"></span>
      <button id="btn-share" class="ghost" title="Copy client link">🔗</button>
    </header>

    <div id="card-stack" class="card-stack"></div>

    <div class="rating-buttons">
      <button class="rate hate" data-rating="hate" title="Hate (1)"><span>🤮</span>Hate</button>
      <button class="rate dislike" data-rating="dislike" title="Dislike (2)"><span>👎</span>Dislike</button>
      <button class="rate like" data-rating="like" title="Like (3)"><span>👍</span>Like</button>
      <button class="rate love" data-rating="love" title="Love (4)"><span>❤️</span>Love</button>
    </div>
  </section>

  <!-- Voice reason overlay -->
  <div id="reason-overlay" class="overlay hidden">
    <div class="reason-card">
      <div class="grabber"></div>
      <div id="reason-rating-chip" class="chip"></div>
      <h2>In a few sentences, tell us why.</h2>
      <div id="mic-visual" class="mic">
        <div class="mic-ring"></div>
        <div class="mic-icon">🎙️</div>
      </div>
      <div id="audio-meter" class="audio-meter" aria-hidden="true"></div>
      <p id="mic-status" class="mic-status">Starting microphone…</p>
      <textarea id="reason-text" rows="3" placeholder="Your reason appears here. You can also type or edit it."></textarea>
      <div class="reason-actions">
        <button id="btn-skip-reason" class="ghost">Skip</button>
        <button id="btn-save-reason" class="primary">Save &amp; next</button>
      </div>
    </div>
  </div>

  <!-- Done -->
  <section id="view-done" class="view hidden">
    <div class="card panel done-panel">
      <h1>🎉 All done</h1>
      <p id="done-summary"></p>
      <div id="done-counts" class="done-counts"></div>
      <a id="export-link" class="primary button-link">Download catalog (JSON)</a>
      <a id="export-jsonl-link" class="ghost button-link">Download feedback (JSONL)</a>
      <button id="btn-done-home" class="ghost">Back to sessions</button>
    </div>
  </section>

  <!-- Unsaved-writes indicator (rating/reason/audio retry queue) -->
  <div id="save-status" class="save-status hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
